# Review attestations — the ONLY place tier is recorded.
#
# Skills do not declare their own tier. scripts/build_index.py derives it:
#
#     tier = "reviewed"  if an unexpired attestation exists here
#                        AND its sha matches the skill directory's current commit
#            "community" otherwise
#
# The sha pin is the point. A reviewer attests to one exact commit, not to a skill
# name and not to a person. When anything commits to the skill's directory the
# attestation stops applying automatically, and the skill drops back to Community
# without anyone having to notice. That is what makes this survive a
# contributor's account being compromised months after review.
#
# See docs/TIERS.md for promotion and demotion, docs/REVIEW.md for the checklist.
#
# ---------------------------------------------------------------------------
# Shape of an entry:
#
# - skill: "{namespace}/{skill-name}"
#   sha: "<40 chars: git log -1 --format=%H -- skills/{namespace}/{name}, on main>"
#   reviewers: ["AI Lab for Cities at Harvard"] # the attesting party
#   reviewed: YYYY-MM-DD
#   expires: YYYY-MM-DD                         # one year; re-review or demote
#   notes: >
#     For the next reviewer, a year from now, with no memory of this conversation.
#     What did you check closely? What would you look at first if it went wrong?
# ---------------------------------------------------------------------------

attestations:
 - skill: "civic-skills/plain-language-notice-rewriter"
   sha: "df5281504c45f435f11e3040fab7a490e41536af"
   reviewers: ["AI Lab for Cities at Harvard"]
   reviewed: 2026-09-12
   expires: 2027-09-12
   languages: ["en"]
   notes: >
    Lab-authored, in the reserved civic-skills namespace  item 7 was judged
    on the Lab's own work, which is where that costs most.

    Read-only in practice: no network destination anywhere in the skill, no
    access outside the working directory, and one executable,
    scripts/reading_level.py, a dependency-free reading-level calculation.
    allowed-tools is Read, Write, Grep, all of which it uses. License CC0-1.0.

    Look here first if it goes wrong: the skill preserves the legally
    required elements the operator lists, and cannot tell them what those
    elements are. A notice that reads well and has quietly lost a required
    element is the failure this cannot catch on its own. It is also
    calibrated for English with a US bias, which does not contradict
    civic.jurisdiction: generic, since a language bias is not a
    jurisdiction, but a non-English deployment is untested.

    Re-attested 2026-09-09 at the commit that added civic.language: en to the
    frontmatter (#145). That line is the only change to the directory since
    the previous pin, 4afc76b, which was itself a manifest regeneration over
    content unchanged since c43c4c1. The checklist was not re-run; the
    content it was run against is byte-identical apart from that line. The
    Verified in English (#143, question 5, ruled 2026-09-13): run on a
    realistic English notice-rewriting task; output in English with every
    promise in the description intact; scripts/reading_level.py works for
    English. It has not been run in any other language, and the script is
    English Flesch-Kincaid, so no other language is recorded.

    Re-attested 2026-09-12 at the commit that added the generated
    .claude-plugin/plugin.json (#186). That registry-written file is the only
    change to the directory since 4bb255c; the skill's own content is
    unchanged since c43c4c1.
