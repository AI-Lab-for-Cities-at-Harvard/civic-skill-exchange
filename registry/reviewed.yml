 - skill: "sgarcese/problem-identification-scan"
   sha: "bce340f5adbe71001aeff6b08c1e7106e4a9fcd2"
   reviewers: ["AI Lab for Cities at Harvard"]
   reviewed: 2026-10-19
   expires: 2027-10-19
   languages: ["en"]
   models: ["Claude Opus 5.5", "Claude Opus 5", "Claude Sonnet 5"]
   notes: >
    Written by Santi Garces and reviewed by hand by the same person for the
    Lab, so nobody outside the author has read it. Reviewed under its new name
    (it was the jurisdictional priority scan before #266), and run by the
    reviewer in English.

    No scripts ship with it. It reads the jurisdiction's open data portal
    through an OpenContext MCP connector, and uses a web search and fetch tool
    for local media and public testimony; a social media tool is optional and
    the skill says so when it has none. It holds no credentials of its own.
    The five domain packs under references/domains assume US federal programs
    and standards. License MIT.

    Look here first if it goes wrong: the row limits in references/backends.md.
    Every OpenContext backend caps the rows it returns, and a count taken from
    truncated rows is silently wrong, so check that the scan aggregates on the
    server or states the limit.
