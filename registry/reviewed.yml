# Review attestations — the ONLY place tier is recorded.
#
# Skills do not declare their own tier. scripts/build_index.py derives it:
#
#     tier = "reviewed"  if an unexpired attestation exists here
#                        AND its sha matches the skill directory's current commit
#            "community" otherwise
#
# The sha pin is the point. A reviewer attests to one exact content hash, not to
# a skill name and not to a person. When the content changes the attestation stops
# applying automatically, and the skill drops back to Community without anyone
# having to notice. That is what makes this survive a contributor's account being
# compromised months after review.
#
# See docs/TIERS.md for promotion and demotion, docs/REVIEW.md for the checklist.
#
# ---------------------------------------------------------------------------
# Shape of an entry:
#
# - skill: "{namespace}/{skill-name}"
#   sha: "<40-char commit SHA of the tree that was reviewed>"
#   reviewers: ["AI Lab for Cities at Harvard"] # the attesting party
#   reviewed: YYYY-MM-DD
#   expires: YYYY-MM-DD                         # one year; re-review or demote
#   notes: >
#     For the next reviewer, a year from now, with no memory of this conversation.
#     What did you check closely? What would you look at first if it went wrong?
# ---------------------------------------------------------------------------

attestations: [
- skill: "{civic-skills}/{plain-language-notice-rewriter}"
   sha: "d6ad433c8e735741635ae2d011ae5b0bc49d1edc"
   reviewers: ["AI Lab for Cities at Harvard"] # the attesting party
   reviewed: 2026-09-02
   expires: 2027-09-01                         # one year; re-review or demote
   notes: 
     1. Does description honestly describe what the skill does? Yes, 2. Read every line of every file under scripts? Yes, runs a basic reading-level calculation
     3. Is every entry in allowed-tools necessary? yes, basic tools allowed. 4. Is every network destination named, expected, and documented? Yes - none are made. 
     5. Any credential, environment, or filesystem access outside the working directory? No Does anything instruct the agent to disregard prior instructions, conceal an action, or omit something from its summary? No
     7. Civic appropriateness — does this affect anyone's rights, benefits, or legal standing? Yes, this provides public value - making government effective in engaging people.
     8. Is the license present and actually applicable? Yes CC0-0.1, 9. Would this work outside its home jurisdiction? Yes, although it is callibrated in English with a bias for the US.
]
