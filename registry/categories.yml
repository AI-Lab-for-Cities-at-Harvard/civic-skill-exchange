# The category vocabulary. Closed by design — free-text tags make classification
# unenforceable and faceted browsing impossible.
#
# Adding a category is a pull request against this file, and should carry evidence
# that at least two existing skills are miscategorized without it. Splitting a
# category later is easy; merging two that never should have been separate is not.
#
# scripts/validate.py enforces these ids at runtime, so this file is the single
# source of truth for the vocabulary.

categories:
  - id: constituent-services
    label: Constituent services & casework
    description: >
      Intake, triage, correspondence, case notes, and service requests — the
      work of responding to individual residents.

  - id: benefits-eligibility
    label: Benefits & eligibility
    description: >
      Screening, eligibility rules, application support, notices, and appeals
      for public benefit programs.

  - id: permitting-licensing
    label: Permitting & licensing
    description: >
      Applications, plan review, inspections, status explanation, and renewal
      for permits and licenses.

  - id: procurement-contracting
    label: Procurement & contracting
    description: >
      Solicitations, scopes of work, bid evaluation, vendor questions, and
      contract administration.

  - id: budget-finance
    label: Budget & finance
    description: >
      Budget preparation and presentation, financial reporting, grants
      accounting, and fiscal analysis.

  - id: public-records-foia
    label: Public records & FOIA
    description: >
      Records requests, responsive-document review, redaction support, and
      response letters.

  - id: open-data-publishing
    label: Open data & publishing
    description: >
      Dataset preparation, metadata, data dictionaries, quality checks, and
      publication workflows.

  - id: policy-legislative
    label: Policy & legislative analysis
    description: >
      Bill and ordinance analysis, fiscal notes, comparative policy research,
      and briefing material.

  - id: grants-development
    label: Grants & development
    description: >
      Opportunity research, narrative drafting, budget justification, and
      reporting — for both applicants and funders.

  - id: emergency-public-safety
    label: Emergency management & public safety
    description: >
      Incident documentation, public information, after-action review, and
      preparedness planning.

  - id: plain-language-accessibility
    label: Plain language & accessibility
    description: >
      Rewriting government text for readability, plain-language review, and
      accessibility remediation.

  - id: language-access
    label: Translation & language access
    description: >
      Translation support, terminology consistency, and language-access
      compliance.
