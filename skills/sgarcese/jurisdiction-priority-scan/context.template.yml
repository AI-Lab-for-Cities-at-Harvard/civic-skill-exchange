# Context for a generalized skill.
#
# Copy this beside the skill, fill every TODO, and run `localize` — or hand it
# to whoever adopts the skill so they can fill it in for their organization.
#
# Every value marked TODO must be replaced. `localize` refuses to produce a
# skill while any remain, because a plausible wrong value is worse than a
# missing one.
#
# One filled copy configures one principal agency in one domain. A jurisdiction
# scanning labor and human services localizes twice.

# Which version of the contract this file was written against. A reader that
# finds a newer number than it understands must stop rather than guess; one that
# finds no number at all must ask what wrote the file. Never delete this line.
contract_version: 1

# Written by `generalize`, not by you. Says who this skill is for and how far it
# was generalized to travel. Read it first: if your organization sits outside the
# reach, re-generalize rather than fill this in, because what was left standing
# is invisible from here.
scope:
  tier: other         # Operates at state OR city tier; the domain pack chosen
                      # in `domain` sets which. See GENERALIZE-NOTES.md.
  reach: >
    Any US state, or US city or county, that publishes open data through an
    OpenContext MCP connector (Socrata, CKAN, ArcGIS Hub, Opendatasoft, or a
    custom plugin), scanning one agency in one domain that has a pack under
    references/domains/. US federal programs, federal standards and federal
    data sources were kept as shared context. Not generalized for use outside
    the US.
  reaches-into: ["country", "state"]

# Read before the skill body, so these cannot contain {{placeholders}}.
jurisdiction: TODO
description: TODO
use_when: TODO
avoid_when: TODO

# Optional. The language the localized skill's output should be written in.
# Defaulted to the source skill's language; change it if your memos should be
# written in another language.
language: en

slots:
  domain:
    what: >
      Which domain pack this scan uses — the file name, without .md, of one pack
      in references/domains/: state-labor, state-hhs, city-311, city-cad, or
      city-operations. One per localized copy.
    exact: true
    value: TODO

  principal:
    what: >
      The agency whose remit defines List A, the short form you want used in
      headings, and the office the memo is prepared for. For example: "the
      state labor department (DOL); memo prepared for the Office of the
      Commissioner". A description is fine if the office title changes often.
    exact: false
    value: TODO

  principal_remit:
    what: >
      The programs and functions that agency actually owns — what counts as a
      "core" problem rather than an adjacent one. A plain list is enough. Say
      so if something the domain pack assumes is owned by a different agency
      here (for example, Medicaid run by a separate department).
    exact: false
    value: TODO

  open_data_connector:
    what: >
      The name of your OpenContext connector exactly as it appears inside
      Claude's tool names, with underscores for spaces — the part between
      "mcp__" and the backend prefix. If the connector is called "Denver Open
      Data", this is Denver_Open_Data.
    exact: true
    value: TODO

  open_data_backend:
    what: >
      The OpenContext backend prefix your connector's tools use: socrata, ckan,
      arcgis, opendatasoft, or a custom plugin's prefix. It is the part after
      the connector name in the tool names.
    exact: true
    value: TODO

  portal_url:
    what: "The public URL of your open data portal, used in citations."
    exact: true
    value: TODO

  secondary_connectors:
    what: >
      Other OpenContext connectors worth one cross-tier query — the state's
      portal for a city scan, or a large city's portal for a state scan — each
      as connector name and backend prefix. Write "none" if there are none.
    exact: true
    value: TODO

  seed_datasets:
    what: >
      Datasets on your portal already known to be relevant to this domain: ID,
      name, coverage period, what it is used for, and the date you last checked
      each ID works. Five to fifteen is plenty. Write "none" to have the scan
      search the portal instead — slower, not wrong.
    exact: true
    value: TODO

  known_data_quirks:
    what: >
      Problems you already know about in these datasets — columns that mix
      counties with regions or districts, inconsistent date fields, stock
      columns people keep summing, series that do not reconcile. Plain
      descriptions are fine. "None known" is a real answer.
    exact: false
    value: TODO

  local_media:
    what: >
      The local news outlets that cover this agency — daily and weekly papers,
      public radio, TV stations, nonprofit newsrooms — and, if you know them,
      community forums or social accounts where residents raise problems with
      its services. Names are enough; web addresses help the search.
    exact: false
    value: TODO
  term_length_years:
    what: >
      The length in years of the principal's term of office — the governor's
      for a state agency, the mayor's for a city agency. Sets the longest
      horizon tag. A number.
    exact: true
    value: TODO

  audit_office:
    what: >
      The office that publishes program audits of this agency — state auditor,
      comptroller, inspector general, city auditor or controller. A name or a
      description is enough.
    exact: false
    value: TODO

  testimony_venues:
    what: >
      Where problems in this domain get asserted on the record — legislative or
      council committees, budget hearings, the rulemaking docket. A short list
      of names or descriptions is enough.
    exact: false
    value: TODO

  quick_scan_skill:
    what: >
      The name of an installed quick-scan companion skill for live demos, if
      you have one. Write "none" if not.
    exact: true
    value: TODO

# Judgments, not facts. The source skill used no peer set, so none was
# extracted. Domain packs note where a peer comparison would be a judgment.
comparators: {}
