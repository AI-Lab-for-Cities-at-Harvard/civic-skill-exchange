# One organization's answers, reused by every skill it adopts.
#
# Written and updated by `localize-skill`. Keep it somewhere stable — the point
# of this file is that the second skill asks fewer questions than the first, and
# the fifth asks almost none.
#
# What belongs here: anything whose answer would be the same if this
# organization adopted a completely different skill. A fiscal year belongs. A
# dataset identifier does not.
#
# Every value carries where it came from:
#   asked      — a person supplied it
#   derived    — found in a public source and confirmed by a person
#   defaulted  — assumed, NOT confirmed. Treat as provisional wherever it lands.
#
# Provenance travels. A defaulted value inherited into a fifth skill has not
# become more true along the way.

# Which contract version this profile's entry shape follows. This file is
# inherited by every skill the organization adopts, so it outlives more readers
# than any single context file — the version matters more here, not less.
contract_version: 1

organization: TODO
scope_tier: TODO        # international | country | state | county | city |
                        # neighborhood | other

profile:
  jurisdiction:
    what: "Legal name of the organization, as it would appear on a document."
    exact: false
    from: TODO
    value: TODO

