# Context for a generalized skill.
#
# Copy this beside the skill, fill every TODO, and run `localize` — or hand it
# to whoever adopts the skill so they can fill it in for their organization.
#
# Every value marked TODO must be replaced. `localize` refuses to produce a
# skill while any remain, because a plausible wrong value is worse than a
# missing one.

# Which version of the contract this file was written against. A reader that
# finds a newer number than it understands must stop rather than guess; one that
# finds no number at all must ask what wrote the file. Never delete this line.
contract_version: 1

# Written by `generalize`, not by you. Says who this skill is for and how far it
# was generalized to travel. Read it first: if your organization sits outside the
# reach, re-generalize rather than fill this in, because what was left standing
# is invisible from here.
scope:
  tier: TODO          # international | country | state | county | city |
                      # neighborhood | other
  reach: TODO         # How far this was generalized to travel. Anything above
                      # that line was deliberately kept, not overlooked.
  reaches-into: []    # Tiers the skill cites without operating at.

# Read before the skill body, so these cannot contain {{placeholders}}.
jurisdiction: TODO
description: TODO
use_when: TODO
avoid_when: TODO

# Facts about one organization. Each appears in the skill body as {{key}}.
#
# `exact: true`  — consumed by machinery; one right answer. A field name, an
#                  identifier, a URL. Approximating here breaks the skill.
# `exact: false` — read as prose; a high-level answer is genuinely enough. A
#                  cadence, an office, a rough threshold. "We do it informally"
#                  is a real answer, not a refusal to answer.
slots: {}
  # example_field:
  #   what: "A sentence someone at another organization can act on without
  #          reading the skill."
  #   exact: true
  #   value: TODO

# Judgments, not facts — a peer set, a benchmark group, a reference population.
# Separated because an adopter who keeps these has not necessarily made a
# mistake, whereas one who keeps a slot on its original value has.
comparators: {}
  # peer_organizations:
  #   what: "Who to benchmark against, and on what basis."
  #   value: TODO
