# Gate 1 of 3: submitted skills.
#
# Runs on every pull request and ALWAYS reports, even when no skill changed.
# A required status check that is filtered out by `paths:` never reports at all,
# which leaves the pull request permanently unmergeable rather than passing — so
# the filtering happens inside the job, not on the trigger.
#
# The scanning steps read untrusted, contributor-authored content. This job
# therefore holds NOTHING: no secrets, no write scope, no persisted credentials.
# Anything needing a token lives in report.yml, which runs afterwards on
# workflow_run and never reads skill content. Do not merge these two files.
#
# See docs/SECURITY.md — "CI hardening".

name: Skills

on: pull_request

permissions:
  contents: read

concurrency:
  group: skills-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Skills — structure, ownership, signatures
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Untrusted values reach the shell through the environment, never through
      # ${{ }} expansion into a command string. github.head_ref in particular is
      # attacker-controlled. This is the same discipline that keeps event text
      # out of model prompts.
      - name: Work out what changed
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          # Deletions are in this list, and --no-renames keeps both sides of a
          # move in it: --name-only prints a detected rename as its destination
          # alone, so the namespace a skill was moved *out of* was invisible to
          # the ownership check (#154). L1 is a statement about paths, and a
          # path that left the tree is still a path the pull request touched.
          git diff --name-only --no-renames "origin/$BASE_REF...HEAD" > changed.txt
          if grep -q '^skills/' changed.txt; then
            echo "skills=true" >> "$GITHUB_OUTPUT"
          else
            echo "skills=false" >> "$GITHUB_OUTPUT"
          fi
          # Separately, and deliberately not gated on the above: a SKILL.md is a
          # submission wherever it sits. Deciding whether to validate by looking
          # for skills/ is what let three skills land outside it (#85).
          if grep -qE '(^|/)SKILL\.md$' changed.txt; then
            echo "skillmd=true" >> "$GITHUB_OUTPUT"
          else
            echo "skillmd=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed paths:"; cat changed.txt

      - name: Nothing to validate
        if: steps.changes.outputs.skills != 'true' && steps.changes.outputs.skillmd != 'true'
        run: echo "This pull request touches no skills/, so there is nothing to validate."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.skills == 'true' || steps.changes.outputs.skillmd == 'true'
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changes.outputs.skills == 'true' || steps.changes.outputs.skillmd == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.skills == 'true' || steps.changes.outputs.skillmd == 'true'
        run: |
          npm ci --workspace @civic-skill-exchange/validator
          pip install -r requirements-dev.txt   # scan.py only; validation is TypeScript now

      # Before L0, because L0 cannot see a skill that is not where skills live.
      # A submission outside skills/{namespace}/{name}/ used to skip every check
      # in this file and go green (#85).
      - name: Layout — every changed SKILL.md is somewhere the registry reads
        if: steps.changes.outputs.skillmd == 'true'
        run: npx tsx validator/src/cli.ts --layout changed.txt

      # L1 covers deletions and moves, and the exchange's maintainers still have
      # to be able to delist a skill and migrate one between namespaces — which
      # the ownership check otherwise reads as writing into a namespace they do
      # not own. So the exemption is resolved here and handed to the validator
      # as a flag, which keeps an access-control list out of a module the
      # submission page also runs in the browser.
      #
      # Team membership in the organization is the real record, and the API
      # would be the direct way to ask for it. This job holds no token — that
      # split from report.yml is the whole reason it can read contributor
      # content safely (docs/SECURITY.md, "CI hardening") — and the
      # org-membership endpoints need one. So the source is
      # .github/maintainers.yml, which CODEOWNERS gates, and it is read from the
      # BASE branch: the checkout above is the contributor's tree, so a pull
      # request that added its own author to that file while deleting somebody
      # else's skill would otherwise grant itself the exemption.
      - name: Resolve whether the author maintains the exchange
        id: maintainer
        if: steps.changes.outputs.skills == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          listed=$(git show "origin/$BASE_REF:.github/maintainers.yml" 2>/dev/null |
            sed -n 's/^[[:space:]]*-[[:space:]]*\([A-Za-z0-9][A-Za-z0-9-]*\)[[:space:]]*$/\1/p' |
            tr '[:upper:]' '[:lower:]') || listed=""
          author=$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          if [ -n "$listed" ] && printf '%s\n' "$listed" | grep -qxF "$author"; then
            echo "maintainer=true" >> "$GITHUB_OUTPUT"
            echo "On the maintainers list: L1 path ownership is not enforced."
          else
            echo "maintainer=false" >> "$GITHUB_OUTPUT"
            echo "Not on the maintainers list: L1 applies to every changed path."
          fi

      # L0 and L1 run the same module the submission form runs in the browser,
      # so a contributor cannot be told "valid" by the site and rejected here.
      # See validator/src/rules.ts.
      - name: L0 + L1 — structure and namespace ownership
        if: steps.changes.outputs.skills == 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_MAINTAINER: ${{ steps.maintainer.outputs.maintainer }}
        run: |
          args=(--changed changed.txt --author "$PR_AUTHOR")
          if [ "$IS_MAINTAINER" = "true" ]; then args+=(--maintainer); fi
          npx tsx validator/src/cli.ts "${args[@]}"

      # Reported, never required. The manifests are committed rather than built,
      # because `/plugin marketplace add` reads the repository and not the
      # published site — but nothing about that is a submitter's problem: a
      # folder uploaded in a browser cannot carry a generated file, and #170
      # made this blocking anyway, which is how the first such submission
      # (#187) arrived unmergeable. The regeneration happens on main after the
      # merge, in .github/workflows/manifest.yml (#188).
      #
      # The step stays because a maintainer reads it: stale here means this
      # merge will trigger a regeneration, and current here means it will not.
      - name: Marketplace manifest is current
        if: steps.changes.outputs.skills == 'true'
        continue-on-error: true   # nothing is needed from the submitter
        run: |
          if python scripts/build_marketplace.py --check; then
            exit 0
          fi
          echo "Nothing is needed from you. The registry regenerates these"
          echo "files on main after this pull request merges, in the workflow"
          echo ".github/workflows/manifest.yml."
          exit 1

      - name: L2 + L3 — signature scan
        if: always() && steps.changes.outputs.skills == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/scan.py --changed changed.txt --out findings.json --pr "$PR_NUMBER"

      # L4 — a purpose-built skill scanner belongs here. General-purpose LLM
      # security products do not cover this artifact type; use a dedicated tool.
      # - name: L4 — skill scanner
      #   run: uvx skillspector scan skills/ --format json --out l4.json

      # Only uploaded when skills actually changed, so report.yml stays silent on
      # tooling and site pull requests instead of commenting "nothing found".
      #
      # findings.json alone. This artifact used to carry a pr-number.txt saying
      # which pull request to comment on, and this job runs on `pull_request`
      # from a fork's tree — so the number was the fork's to choose, and the
      # privileged reporting job posted wherever it pointed (#153). report.yml
      # resolves the pull request from the workflow_run event now, so there is
      # nothing here for it to trust or to cross-check.
      - name: Upload findings
        if: always() && steps.changes.outputs.skills == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings
          path: findings.json
          retention-days: 7
