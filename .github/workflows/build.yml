# Builds the static JSON index and deploys the site to GitHub Pages.
#
# Runs only on main, where content has already passed validate.yml and been merged.
# This job does hold a deploy token, so it must never run against a fork's head.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build index
    runs-on: ubuntu-latest
    steps:
      # TODO: pin every action to a commit SHA before enabling. Tags move.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build_index.py needs history to resolve per-skill SHAs
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jsonschema

      - name: Validate everything
        run: python scripts/validate.py all

      - name: Scan everything
        run: python scripts/scan.py all --out findings.json
        continue-on-error: true   # a finding on main is an issue to open, not a broken deploy

      - name: Build index
        run: python scripts/build_index.py --out site/data --findings findings.json

      - name: Assemble the site
        run: |
          mkdir -p site/dist
          cp -r site/data site/dist/data
          if [ -d site/public ]; then cp -r site/public/. site/dist/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
