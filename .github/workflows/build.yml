# Builds the static JSON index and deploys the site to GitHub Pages.
#
# Runs only on main, where content has already passed validate.yml and been merged.
# This job does hold a deploy token, so it must never run against a fork's head.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # build_index.py needs history to resolve per-skill SHAs
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: pip install pyyaml

      - name: Validate everything
        run: npx tsx validator/src/cli.ts all

      - name: Scan everything
        run: python scripts/scan.py all --out findings.json
        continue-on-error: true   # a finding on main is an issue to open, not a broken deploy

      # Into site/public/ so Vite copies it verbatim into dist/data/.
      - name: Build index
        run: python scripts/build_index.py --out site/public/data --findings findings.json

      - name: Build the site
        working-directory: site
        run: |
          npm run test
          npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
