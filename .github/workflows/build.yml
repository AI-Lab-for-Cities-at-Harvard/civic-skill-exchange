# Builds the static JSON index and deploys the site to GitHub Pages.
#
# Runs only on main, where content has already passed validate.yml and been merged.
# This job does hold a deploy token, so it must never run against a fork's head.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # build_index.py needs history to resolve per-skill SHAs
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: pip install pyyaml

      - name: Validate everything
        run: npx tsx validator/src/cli.ts all

      - name: Scan everything
        run: python scripts/scan.py all --out findings.json
        continue-on-error: true   # a finding on main is an issue to open, not a broken deploy

      # Into site/public/ so Vite copies it verbatim into dist/data/.
      - name: Build index
        run: python scripts/build_index.py --out site/public/data --findings findings.json

      - name: Build the site
        working-directory: site
        run: |
          npm run test
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
