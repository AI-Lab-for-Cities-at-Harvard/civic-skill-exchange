# Builds the static JSON index and deploys the site to GitHub Pages.
#
# Runs only after Checks (test.yml) completes on main, and only when it passed.
# A direct push to main once failed Tooling — pytest on both Python versions and
# this workflow deployed it anyway, because it ran on every push with no
# dependency on Checks at all (#160). It now waits on workflow_run and re-checks
# the conclusion itself: a red main must never deploy.
#
# The checkout below takes github.event.workflow_run.head_sha, not whatever
# main is at run time — main could have moved again between Checks finishing
# and this workflow starting. The deployed tree is exactly the commit Checks
# passed.
#
# This job holds a deploy token (via pages: write / id-token: write, scoped to
# the deploy job only), so it must never run against a fork's head — it never
# checks out a pull request, and workflow_run only fires for runs on branches
# in this repository.

name: Build and deploy

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build index
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0          # build_index.py needs history to resolve per-skill SHAs
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: pip install -r requirements-dev.txt

      - name: Validate everything
        run: npx tsx validator/src/cli.ts all

      - name: Scan everything
        run: python scripts/scan.py all --out findings.json
        continue-on-error: true   # a finding on main is an issue to open, not a broken deploy

      # Into site/public/ so Vite copies it verbatim into dist/data/.
      - name: Build index
        run: python scripts/build_index.py --out site/public/data --findings findings.json

      - name: Build the site
        working-directory: site
        run: |
          npm run test
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
