# Tests for the registry's own tooling — validate.py, scan.py, build_index.py.
#
# Separate from validate.yml, which tests submitted SKILLS. This one tests the
# things that test the skills, and must pass before any change to the pipeline
# merges. A scanner nobody tested is a scanner nobody can trust.

name: Tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "schema/**"
      - "registry/**"
      - "tests/**"
      - "pytest.ini"
      - "site/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # TODO: pin to commit SHAs before relying on this in branch protection.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install pyyaml jsonschema pytest

      - run: python -m pytest -q

      # The seed skills must always pass their own pipeline. If this breaks, the
      # registry is asking contributors to meet a bar it does not meet itself.
      - name: Self-check the committed skills
        run: |
          python scripts/validate.py all
          python scripts/scan.py all

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      # TODO: pin to commit SHAs before relying on this in branch protection.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Typecheck
        working-directory: site
        run: npx tsc -b

      - name: Test
        working-directory: site
        run: npm run test

      - name: Build
        working-directory: site
        run: npx vite build
