# Gates 2 and 3: the registry's own tooling, and the site.
#
# Separate from the Skills gate, which validates submitted SKILLS. These validate
# the things that validate the skills, plus the site that publishes them. A
# scanner nobody tested is a scanner nobody can trust.
#
# Both jobs run on every pull request and ALWAYS report. A required status check
# filtered out by `paths:` never reports at all, which leaves the pull request
# permanently unmergeable rather than passing — so the filtering happens inside
# each job. A pull request that touches neither area gets two fast green checks
# that say so explicitly.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------- #
  tooling:
    name: Tooling — pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out what changed
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tooling=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          if grep -qE '^(scripts|schema|registry|tests|skills)/|^pytest\.ini$|^\.github/workflows/' changed.txt; then
            echo "tooling=true" >> "$GITHUB_OUTPUT"
          else
            echo "tooling=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to test
        if: steps.changes.outputs.tooling != 'true'
        run: echo "This pull request touches no tooling, schema, or skills. Nothing to test."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changes.outputs.tooling == 'true'
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        if: steps.changes.outputs.tooling == 'true'
        run: pip install pyyaml pytest

      - name: Test
        if: steps.changes.outputs.tooling == 'true'
        run: python -m pytest -q

      # The committed skills must always pass their own scan. Structural
      # validation is the validator workspace's job — see the Validator gate.
      - name: Self-scan the committed skills
        if: steps.changes.outputs.tooling == 'true'
        run: python scripts/scan.py all

  # --------------------------------------------------------------------- #
  site:
    name: Site — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out what changed
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          if grep -qE '^site/|^\.github/workflows/' changed.txt; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to build
        if: steps.changes.outputs.site != 'true'
        run: echo "This pull request touches no site/. Nothing to build."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.site == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        if: steps.changes.outputs.site == 'true'
        working-directory: site
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        working-directory: site
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        working-directory: site
        run: npx tsc -b

      - name: Test
        if: steps.changes.outputs.site == 'true'
        working-directory: site
        run: npm run test

      - name: Build
        if: steps.changes.outputs.site == 'true'
        working-directory: site
        run: npx vite build

  # --------------------------------------------------------------------- #
  validator:
    name: Validator — typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out what changed
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "validator=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          if grep -qE '^(validator|registry|schema|skills)/|^package(-lock)?\.json$|^\.github/workflows/' changed.txt; then
            echo "validator=true" >> "$GITHUB_OUTPUT"
          else
            echo "validator=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to check
        if: steps.changes.outputs.validator != 'true'
        run: echo "This pull request touches no validator inputs. Nothing to check."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.validator == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install
        if: steps.changes.outputs.validator == 'true'
        run: npm ci --workspace @civic-skill-exchange/validator

      - name: Typecheck
        if: steps.changes.outputs.validator == 'true'
        run: npm run typecheck --workspace @civic-skill-exchange/validator

      - name: Test
        if: steps.changes.outputs.validator == 'true'
        run: npm run test --workspace @civic-skill-exchange/validator

      # The committed skills must always pass their own validation. If this
      # breaks, the registry is asking contributors to meet a bar it does not.
      - name: Self-check the committed skills
        if: steps.changes.outputs.validator == 'true'
        run: npx tsx validator/src/cli.ts all
