# Layer L6 — the standing re-scan.
#
# Everything else in this pipeline is a SUBMISSION-TIME gate, and submission-time
# gates do nothing about the dominant failure mode in this ecosystem: a legitimate
# contributor whose account is compromised months after their skill was merged.
#
# This workflow is ten lines of scheduling and it covers a gap the rest of the
# pipeline structurally cannot. Turn it on the same day you open submissions, not
# later. See docs/SECURITY.md.

name: Weekly re-scan

on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rescan:
    name: Re-scan the whole tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: pip install -r requirements-dev.txt

      - name: Validate
        id: validate
        continue-on-error: true
        run: npx tsx validator/src/cli.ts all 2>&1 | tee validate.log

      - name: Scan
        id: scan
        continue-on-error: true
        run: python scripts/scan.py all --out findings.json 2>&1 | tee scan.log

      # Detects attestations whose sha no longer matches the skill's current tree.
      # Those skills are already demoted by the build; this is how a human hears
      # about it.
      # The manifests are regenerated inside each skill pull request now, and
      # nothing pushes a repair to main afterwards (#170) — so this is the only
      # thing that still checks main itself. It never repairs anything, only
      # reports, so a failure here means a stale manifest reached main, not
      # that somebody forgot a step.
      - name: Marketplace manifests match the catalogue
        id: manifest
        run: python scripts/build_marketplace.py --check

      # --drift-out is the machine-readable half of demotion (#156): the index
      # still builds when an attestation no longer matches — that is the
      # point — so nothing else here reflects it unless something is asked to.
      # has_drift lets the issue step's `if:` see the result without parsing
      # the JSON itself.
      - name: Check attestation drift
        id: drift
        if: always()
        continue-on-error: true
        run: |
          python scripts/build_index.py --out /tmp/index --findings findings.json \
            --drift-out drift.json
          if [ -f drift.json ] && [ "$(cat drift.json)" != "[]" ]; then
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          fi

      # Renders the issue body ahead of the step that posts it, through the
      # same fencing rule the pull request comment already trusts. Without
      # this, validate.log and scan.log — raw output from a run over
      # skills/, so contributor-authored text can appear in either — would go
      # into a triple-backtick fence unescaped, and a matched excerpt
      # containing three backticks could close it early. See
      # validator/src/report.ts's `renderRescanReport` and `fence()`.
      #
      # Outcomes arrive through env, not `${{ }}` spliced into the script,
      # even though each is one of a fixed set of words GitHub assigns.
      - name: Render the issue body
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          python3 - <<'PY' > failed-steps.json
          import json, os

          names = []
          if os.environ.get("VALIDATE_OUTCOME") == "failure":
              names.append("Validate")
          if os.environ.get("SCAN_OUTCOME") == "failure":
              names.append("Scan")
          if os.environ.get("MANIFEST_OUTCOME") == "failure":
              names.append("Marketplace manifests match the catalogue")
          if os.environ.get("DRIFT_OUTCOME") == "failure":
              names.append("Check attestation drift")
          print(json.dumps(names))
          PY

          npx tsx validator/src/report-cli.ts --rescan \
            --validate-log validate.log --scan-log scan.log \
            --drift-json drift.json --failed-steps failed-steps.json \
            --out issue-body.md

      # `always()` so a manifest-check failure — no continue-on-error above,
      # deliberately — does not abort the job before this ever runs. Without
      # it a stale manifest was never reported (#156): the condition below
      # named only validate and scan, and even that never got the chance to
      # be evaluated once the manifest step failed.
      - name: Open an issue on new findings
        if: >-
          always() &&
          (steps.validate.outcome == 'failure' ||
           steps.scan.outcome == 'failure' ||
           steps.manifest.outcome == 'failure' ||
           steps.drift.outcome == 'failure' ||
           steps.drift.outputs.has_drift == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('issue-body.md')
              ? fs.readFileSync('issue-body.md', 'utf8')
              : 'The weekly re-scan failed before it could render a report. Check the workflow run.';

            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly re-scan findings — ${today}`,
              body,
              labels: ['security', 'rescan'],
            });
