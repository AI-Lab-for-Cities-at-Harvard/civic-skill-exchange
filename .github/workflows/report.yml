# Posts scan results back to the pull request.
#
# This job is privileged, so it must never touch skill content. It reads ONLY the
# structured findings.json artifact produced by validate.yml, and renders a comment
# from typed fields — signature name, file path, line number — never from
# contributor-authored strings.
#
# The excerpt field IS contributor-authored. It is fenced and length-capped below.
# If you extend this file, keep that discipline: an injected issue title has already
# stolen an npm publish token from a workflow shaped like this one.
#
# See docs/SECURITY.md — "CI hardening".

name: Report

on:
  workflow_run:
    workflows: [Skills]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment findings on the pull request
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      # validate.yml uploads this artifact only when a pull request actually
      # touches skills/, so on a tooling or site change there is nothing to
      # download and this step fails. That is the expected path, not an error:
      # the render step below already treats a missing artifact as "nothing to
      # report" and exits clean. Without continue-on-error the whole workflow
      # goes red on every non-skill pull request, which is how it sat from #20
      # to #33 — and a permanently red check is one nobody reads.
      - name: Download findings
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: findings
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and post
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('findings.json') || !fs.existsSync('pr-number.txt')) {
              core.info('No findings artifact; nothing to report.');
              return;
            }

            const pr = parseInt(fs.readFileSync('pr-number.txt', 'utf8').trim(), 10);
            if (!Number.isInteger(pr)) { core.setFailed('Bad PR number.'); return; }

            const data = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            const conclusion = context.payload.workflow_run.conclusion;

            // Contributor-authored text is fenced and truncated. Never interpolate
            // it into markdown that could carry links, images, or directives.
            const safe = (s) => '`' + String(s).replace(/`/g, "'").slice(0, 120) + '`';

            const render = (list) => list.map(f =>
              `- **${f.signature}** — ${safe(f.file)} line ${Number(f.line) || 0}\n` +
              `  <sub>${f.excerpt ? safe(f.excerpt) : ''}</sub>`
            ).join('\n');

            let body = `## Automated checks\n\n`;

            if (conclusion !== 'success') {
              body += `Validation did not pass. See the workflow run for details.\n\n`;
            }

            const blocking = [], flags = [];
            for (const [id, r] of Object.entries(data.results || {})) {
              for (const f of r.blocking || []) blocking.push({ ...f, file: `${id}/${f.file}` });
              for (const f of r.flags || [])    flags.push({ ...f, file: `${id}/${f.file}` });
            }

            if (blocking.length) {
              body += `### Blocking — ${blocking.length}\n\n` +
                `These signatures are high precision and fail the build.\n\n` +
                render(blocking) + `\n\n` +
                `Please do not rewrite the code to dodge the pattern. Explain what ` +
                `you are trying to do in a comment — there are legitimate reasons ` +
                `to need these, and a maintainer would rather discuss it.\n\n`;
            }

            if (flags.length) {
              body += `### Flagged for review — ${flags.length}\n\n` +
                `These are noisy by design and do **not** block. Several fire on ` +
                `entirely legitimate skills — an external-URL match trips on ` +
                `anything citing documentation. A maintainer will look.\n\n` +
                render(flags) + `\n\n`;
            }

            if (!blocking.length && !flags.length && conclusion === 'success') {
              body += `No signatures matched across ${data.skills_scanned || 0} skill(s).\n\n`;
            }

            body += `---\n<sub>Automated checks verify structure, namespace ` +
              `ownership, and known-bad signatures. They can only ever reject — a ` +
              `pass is not a statement that a skill is safe. Signature scanning is ` +
              `triage, not a gate. See ` +
              `[docs/SECURITY.md](../blob/main/docs/SECURITY.md).</sub>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
