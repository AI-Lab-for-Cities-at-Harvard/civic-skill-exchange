name: Submit a skill
description: Propose a skill for the registry without working in git directly.
title: "Skill submission: "
labels: ["submission"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your work.

        If you're comfortable with git, opening a pull request is faster — see
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). This form is for everyone else;
        a maintainer will help turn it into a pull request.

        **Everything you submit lands in the Community tier**, which means it passed
        automated checks — not that anyone reviewed it. See
        [docs/TIERS.md](../blob/main/docs/TIERS.md).

  - type: input
    id: name
    attributes:
      label: Skill name
      description: Lowercase, hyphens, no spaces. This becomes the directory name.
      placeholder: permit-status-explainer
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: >
        How an agent decides whether to run this skill. Describe what it actually
        does, not what you hope it will do — a description broader than the
        behaviour makes the skill fire in situations you never handled.
      placeholder: >
        Explains the status of a municipal building permit in plain language, given
        a permit record. Read-only; does not submit or modify applications.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - constituent-services
        - benefits-eligibility
        - permitting-licensing
        - procurement-contracting
        - budget-finance
        - public-records-foia
        - open-data-publishing
        - policy-legislative
        - grants-development
        - emergency-public-safety
        - plain-language-accessibility
        - language-access
    validations:
      required: true

  - type: dropdown
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: "'Generic' means it makes no jurisdiction-specific assumptions."
      options: [us-local, us-state, us-federal, intl, generic]
    validations:
      required: true

  - type: dropdown
    id: localization
    attributes:
      label: Is this skill tied to one jurisdiction?
      description: >
        Leave as "not applicable" if the skill has no jurisdiction-specific
        content — plenty don't. See
        [docs/LOCALIZATION.md](../blob/main/docs/LOCALIZATION.md).
      options:
        - "not applicable — no jurisdiction-specific content"
        - "localized — carries one jurisdiction's citations, forms, deadlines"
        - "generalized — those have been lifted out into a context to fill in"

  - type: dropdown
    id: sensitivity
    attributes:
      label: What data does this skill touch?
      description: >
        'Protected' covers health, benefits, immigration, criminal justice, and
        anything else under a statutory regime.
      options:
        - "none — no personal data"
        - "pii — personally identifiable information"
        - "protected — a statutory regime applies"
    validations:
      required: true

  - type: dropdown
    id: human-review
    attributes:
      label: Does the output affect anyone's rights, benefits, or legal standing?
      description: >
        This is the question a reviewer cannot answer from your code, and the one
        that matters most. Answer it honestly.
      options:
        - "none — no effect on any individual's situation"
        - "advisory-only — informs a person, does not determine anything"
        - "decision-support — feeds a determination a person acts on"
    validations:
      required: true

  - type: textarea
    id: use-when
    attributes:
      label: When is this skill useful? (optional)
      description: >
        The concrete situations where it earns its place. Becomes
        `civic.use-when` in your frontmatter and shows on the skill's page in
        the catalogue. Two sentences is plenty — 500 characters maximum. Plain
        text: markdown here will show up as literal asterisks.
      placeholder: >
        When a resident asks why their permit is stuck and the status codes in the
        system mean nothing to them.

  - type: textarea
    id: avoid-when
    attributes:
      label: When is it NOT useful? (optional — but please answer it)
      description: >
        Where it falls down, what it should not be pointed at, what it gets
        subtly wrong. **This is the most valuable box on the form.** Anyone can
        guess what a skill is for; nobody but you knows where it breaks. A skill
        that is honest about its limits gets adopted by the people it actually
        helps, rather than by people who find out the hard way. Becomes
        `civic.avoid-when`. Same 500-character, plain-text rules.
      placeholder: >
        Not for filled notices containing a specific person's data. Not a substitute
        for legal review of whether required elements are present.

  - type: textarea
    id: tools
    attributes:
      label: What tools does the skill need?
      description: >
        Least privilege. This grant applies **without a permission prompt**, so
        request the narrowest set that works. Wildcard Bash grants are rejected.
      placeholder: "Read, Grep"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### Where has this been used?

        Useful context for anyone deciding whether to adopt it. "Never used in
        production" is a perfectly good answer.

  - type: dropdown
    id: affiliation
    attributes:
      label: Who maintains this skill?
      description: The affiliation of the organization or person named above.
      options:
        - "government — a public agency at any level"
        - "nonprofit"
        - "academic"
        - "vendor — a company serving public agencies"
        - "individual"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Have you used this skill, and at what scale?
      description: The widest scope at which it has actually run — not where you hope it could run.
      options:
        - "none — not used in production anywhere yet"
        - "personal — I have used it myself"
        - "team — a team uses it"
        - "organization — used across an organization"
    validations:
      required: true

  - type: input
    id: deployed-at
    attributes:
      label: Which organization?
      description: >
        Required unless you answered "none".
      placeholder: "City of Boston, Department of Innovation and Technology"

  - type: input
    id: deployed-in
    attributes:
      label: Where does that organization operate?
      description: >
        Required unless you answered "none". ISO country code, then optionally a
        state or province, then optionally a city.
      placeholder: "US-MA / Boston   ·   GB   ·   CA-ON / Toronto"

  - type: input
    id: deployed-since
    attributes:
      label: Roughly since when? (optional)
      description: "YYYY or YYYY-MM."
      placeholder: "2026-03"

  - type: textarea
    id: skill-body
    attributes:
      label: The skill itself
      description: Paste your SKILL.md, or link to where it lives.
      render: markdown
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT
    validations:
      required: true

  - type: input
    id: maintainer
    attributes:
      label: Maintainer
      description: The organization or person accountable for this skill.
      placeholder: "City of X, Department of Building Safety"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        Has this been used in production? Anything a reviewer should look at
        closely? Anything you were unsure about?

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I have the right to share this under the license above.
          required: true
        - label: >
            This skill contains no credentials, no internal URLs, and no
            constituent data.
          required: true
        - label: >
            I understand a Community listing is not a review, and that inclusion
            is not an endorsement.
          required: true
